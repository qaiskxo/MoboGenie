<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobogenie Wallpapers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f2f6;
            color: #333333;
            margin: 0;
            padding: 10px;
        }
        h1 {
            font-size: 1.3rem;
            color: #0084ff;
            margin: 10px 0 20px 5px;
            font-weight: bold;
            border-bottom: 2px solid #0084ff;
            padding-bottom: 5px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            padding: 5px;
            display: flex;
            flex-direction: column;
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            border-radius: 2px;
            background-color: #f7f7f7;
        }
        .card-details {
            padding: 6px 2px 2px 2px;
            text-align: left;
        }
        .card-title {
            margin: 0;
            font-size: 0.85rem;
            font-weight: normal;
            color: #444444;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <h1>Mobogenie Wallpapers</h1>
    
    <div id="gallery" class="gallery-grid"></div>

    <script>
        // Loops through your complete JSON file from the target directory branch layout
        fetch('https://raw.githubusercontent.com/qaiskxo/images/refs/heads/main/Wallpaper/index.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network failure');
                }
                return response.json();
            })
            .then(data => {
                const gallery = document.getElementById('gallery');
                
                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    const cleanUrl = item.url.trim();

                    card.innerHTML = `
                        <a href="${cleanUrl}" target="_blank">
                            <img src="${cleanUrl}" alt="${item.title.trim()}" loading="lazy">
                        </a>
                        <div class="card-details">
                            <h3 class="card-title">${item.title.trim()}</h3>
                        </div>
                    `;
                    gallery.appendChild(card);
                });
            })
            .catch(error => {
                console.error('Error:', error);
            });
    </script>
</body>
</html>
